name: steward-scrub
# Blocking gate: gitleaks + path deny + PHI field + (optional) host deny over the PR/push commit range only.
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          V=8.30.1
          F="gitleaks_${V}_linux_x64.tar.gz"
          curl -fsSL -o "$F" "https://github.com/gitleaks/gitleaks/releases/download/v${V}/${F}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${F}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gl" && tar -xzf "$F" -C "$RUNNER_TEMP/gl" gitleaks
          echo "GITLEAKS=$RUNNER_TEMP/gl/gitleaks" >> "$GITHUB_ENV"
      - name: Scrub fixtures (rules still fire)
        run: tests/steward-scrub/run.sh
      - name: Scrub the commit range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          elif [ -z "${BEFORE//0/}" ]; then
            RANGE="$(git rev-list -n1 --first-parent "$AFTER^" 2>/dev/null | head -1)..${AFTER}"
            git rev-parse --verify -q "origin/main" >/dev/null && RANGE="origin/main..${AFTER}"
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${AFTER}"
          else
            # force-push: the old tip is gone, scan everything not on main
            RANGE="origin/main..${AFTER}"
          fi
          echo "range: $RANGE"
          scripts/steward/scrub.sh "$RANGE"
