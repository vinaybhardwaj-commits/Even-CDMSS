# Gitleaks config (steward scrub gate, git-steward, 14 Oct 2026): the default ruleset plus custom rules.
# scrub.sh runs gitleaks with --ignore-gitleaks-allow, so inline allow comments do not apply.
# Allowlist: only the scrub fixtures path and steward/scrub-allow.txt (merge-owner reviewed).
[extend]
useDefault = true

[allowlist]
description = "the scrub fixtures"
paths = [
  '''^tests/steward-scrub/fixtures/''',
]

[[rules]]
id = "ts-cgnat-ip"
description = "Tailscale CGNAT address (100.64.0.0/10)"
regex = '''(?:\b100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3}(?:[^\d.]|\.[^\d]|\.?$))|(?i:fd7a:115c:a1e0:)'''
keywords = ["100.", "fd7a"]

[[rules]]
id = "ts-hostname"
description = "Tailscale ts.net hostname"
regex = '''(?i)\b[a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)*\.ts\.net\b'''
keywords = ["ts.net"]

[[rules]]
id = "aws-account-id"
description = "AWS account id in an ARN, an account-id field, an ECR host, or a dashed console form"
regex = '''(?i)(?:arn:aws[^:\s]*:[^:\s]*:[^:\s]*:\d{12}(?:[^\d]|$)|(?:aws[ _-]?account[ _-]?id|account[ _-]?id|accountid|ownerid)\D{0,40}\d{12}(?:[^\d]|$)|(?:account[ _-]?id|ownerid)\D{0,40}\d{4}-\d{4}-\d{4}(?:[^\d]|$)|(?:^|[^\d])\d{12}\.dkr\.ecr\.)'''
keywords = ["arn:aws", "account", "ecr", "ownerid"]

[[rules]]
id = "private-key-header"
description = "PEM private key header"
regex = '''-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY( BLOCK)?-----'''
keywords = ["private key"]

[[rules]]
id = "env-secret-assign"
description = "ENV-style assignment of a secret-named variable to a literal value"
regex = '''(?m)^[ \t]*(?:export[ \t]+|ENV[ \t]+)?[A-Z0-9_]*(?:SECRET|TOKEN|PASSWORD|PASSWD|API_KEY|PRIVATE_KEY|ACCESS_KEY|DATABASE_URL|DSN)[A-Z0-9_]*[ \t]*=[ \t]*\S{8,}'''
keywords = ["secret", "token", "password", "passwd", "api_key", "private_key", "access_key", "database_url", "dsn"]
# Reading from another variable or the process environment is not a literal.
[[rules.allowlists]]
description = "value is a reference, not a literal"
regexTarget = "match"
regexes = [
  '''=[ \t]*["']?(?:\$\{?[A-Za-z_]|process\.env|os\.environ|os\.getenv|ENV\[|<[A-Za-z_ -]+>)''',
]

[[rules]]
id = "presigned-url"
description = "Presigned object-store URL (signature, credential or R2 host with a query)"
regex = '''(?i)(?:x-amz-signature=|x-amz-credential=|x-goog-signature=|x-goog-credential=|[?&]sig=[a-z0-9%+/=]{16,}|[a-z0-9.-]+\.r2\.cloudflarestorage\.com/[^\s"']*\?)'''
keywords = ["x-amz-", "x-goog-", "sig=", "r2.cloudflarestorage.com"]

[[rules]]
id = "cdmss-uhid"
description = "UHID value (a code with a prefix, separator or digits) after the word uhid"
regex = '''(?i)\buhid\b[\s"':=(#-]{0,8}[A-Z]{0,5}-?\d{5,9}\b'''
keywords = ["uhid"]
[[rules.allowlists]]
description = "all-zero placeholders"
regexTarget = "match"
regexes = ['''(?i)\buhid\b[\s"':=(#-]{0,8}[A-Z]{0,5}-?0{5,9}\b''']

[[rules]]
id = "cdmss-member-id"
description = "12-digit member / individual / consumer id"
regex = '''(?i)(?:member|individual|consumer)[a-z_ -]{0,12}[\s"':=(#>-]{0,10}\d{12}\b'''
keywords = ["member", "individual", "consumer"]
[[rules.allowlists]]
description = "all-zero placeholders"
regexTarget = "match"
regexes = ['''0{12}\b''']
